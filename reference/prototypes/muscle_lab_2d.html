<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shield Fitness · Muscle Lab (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--bg:#030d15;--bg2:#071a27;--panel:#081d2a;--line:#124457;--cy:#4de8ff;--cy2:#1fa9c4;--tx:#d4f4fb;--mut:#7fa9b6;--hot:#ff4a1c;--soft:#ff9f6b;--amber:#ffc46b;
--disp:'Chakra Petch','Segoe UI',system-ui,sans-serif;--body:'Barlow','Segoe UI',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 var(--body)}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:1280px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:6px 0 12px;border-bottom:1px solid var(--line)}
.brand{font:700 20px var(--disp);letter-spacing:.14em;text-transform:uppercase}.brand b{color:var(--cy)}.brand small{display:block;font:400 11px var(--mono);color:var(--mut);letter-spacing:.08em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#04141d}
.seg button{background:none;border:0;padding:8px 13px;font:600 12px var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);min-height:40px}
.seg button[aria-pressed=true]{background:rgba(77,232,255,.16);color:var(--cy);box-shadow:inset 0 -2px 0 var(--cy)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.seg button:focus-visible,.row:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,.btn:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.ctl{display:flex;gap:10px;flex-wrap:wrap}
main{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:16px;margin-top:14px}
.stage{position:relative;height:clamp(460px,80vh,860px);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#0b3345 0%,#061b28 45%,#030d15 100%);touch-action:pan-y}
.stage .fig{position:absolute;inset:2% 0 7% 0;width:100%;height:91%;animation:flick 6s infinite steps(1)}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(77,232,255,.07) 0 1px,transparent 1px 4px);mix-blend-mode:screen}
.sweep{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,transparent 0,rgba(120,240,255,.12) 50%,transparent 100%);height:22%;animation:sweep 7s linear infinite}
.cone{position:absolute;left:50%;bottom:6%;width:62%;height:84%;transform:translateX(-50%);pointer-events:none;clip-path:polygon(38% 100%,62% 100%,100% 0,0 0);background:linear-gradient(to top,rgba(77,232,255,.16),transparent 80%)}
.base{position:absolute;left:50%;bottom:3.2%;width:54%;height:5.5%;transform:translateX(-50%);border-radius:50%;pointer-events:none;background:radial-gradient(ellipse,rgba(160,250,255,.95) 0,rgba(77,232,255,.55) 28%,rgba(31,169,196,.2) 58%,transparent 72%);box-shadow:0 0 40px 8px rgba(77,232,255,.25)}
.tag{position:absolute;left:12px;top:10px;font:500 11px var(--mono);color:var(--mut);letter-spacing:.08em;pointer-events:none}
.tag b{color:var(--cy);font-weight:500}
.hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:400 11px var(--mono);color:var(--mut);pointer-events:none}
@keyframes flick{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.93}49%{opacity:1}83%{opacity:.96}84%{opacity:1}}
@keyframes sweep{from{transform:translateY(-100%)}to{transform:translateY(480%)}}
@media (prefers-reduced-motion:reduce){.stage .fig{animation:none}.sweep{animation:none;display:none}}
/* figure */
.fig .glow{fill:rgba(77,232,255,.55);stroke:var(--cy);stroke-width:5;opacity:.5}
.fig .body{fill:#0a2a3a;stroke:rgba(77,232,255,.7);stroke-width:2}
.fig .u{fill:rgba(77,232,255,.13);stroke:rgba(110,240,255,.6);stroke-width:1.4;cursor:pointer;transition:fill .15s,stroke .15s}
.fig .u.ap{stroke-dasharray:6 4;fill:rgba(77,232,255,.07)}
.fig:not(.static) .u:hover{fill:rgba(77,232,255,.38)}
.fig.has .u{fill:rgba(77,232,255,.045);stroke:rgba(110,240,255,.28)}
.fig .u.soft{fill:rgba(255,159,107,.3);stroke:var(--soft)}
.fig .u.grp{fill:rgba(255,74,28,.34);stroke:#ff8a5c}
.fig .u.sel{fill:rgba(255,74,28,.82);stroke:#ffb08c;stroke-width:2.2;filter:drop-shadow(0 0 7px rgba(255,74,28,.9))}
.fig .u.pri{fill:rgba(255,74,28,.88);stroke:#ffb08c;stroke-width:1.6}
.fig .u.sec{fill:rgba(255,159,107,.48);stroke:#ffc4a0;stroke-width:1.4}
.fig .u:focus-visible{outline:none;stroke:#fff;stroke-width:3}
.fig.static .u{cursor:default;pointer-events:none}
#tip{position:fixed;z-index:50;pointer-events:none;background:#031219;border:1px solid var(--cy2);color:var(--tx);font:500 11px var(--mono);padding:4px 8px;border-radius:4px;display:none}
/* panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;height:clamp(460px,80vh,860px);min-height:0}
.ptabs{display:flex;border-bottom:1px solid var(--line)}
.ptabs button{flex:1;background:none;border:0;padding:11px;font:600 12px var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);min-height:44px}
.ptabs button[aria-selected=true]{color:var(--cy);box-shadow:inset 0 -2px 0 var(--cy)}
.pbody{overflow:auto;padding:12px;flex:1;min-height:0}
.handle{display:none}
input[type=search],select{width:100%;background:#04141d;border:1px solid var(--line);color:var(--tx);border-radius:6px;padding:10px 12px;font:inherit;min-height:42px}
.list{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#061722;border:1px solid var(--line);border-radius:6px;padding:9px 11px;min-height:46px}
.row:hover{border-color:var(--cy2)}.row .nm{flex:1;font-weight:500}.row .meta{font:400 11px var(--mono);color:var(--mut)}
.badge{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.badge.clear{color:var(--cy);border-color:var(--cy2)}.badge.approx{color:var(--amber);border-color:#8a6a2d;border-style:dashed}.badge.list{color:var(--mut)}
.badge.pri{background:var(--hot);border-color:var(--hot);color:#1a0600;font-weight:500}.badge.sec{background:rgba(255,159,107,.25);border-color:var(--soft);color:var(--soft)}
h2{font:700 24px var(--disp);margin:6px 0 4px;letter-spacing:.03em}h3{font:600 12px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--cy);margin:16px 0 8px}
.sub{color:var(--mut);font-size:13px}.note{font-size:13px;border-left:2px solid var(--amber);padding:6px 10px;background:rgba(255,196,107,.07);margin:10px 0;color:#f1dcb4}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.btn{background:#06202e;border:1px solid var(--cy2);border-radius:6px;padding:8px 12px;font:600 12px var(--disp);letter-spacing:.08em;text-transform:uppercase;min-height:40px}
.btn[aria-pressed=true]{background:var(--hot);border-color:var(--hot);color:#1a0600}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ex{background:#061722;border:1px solid var(--line);border-radius:6px;margin-bottom:6px}.ex summary{list-style:none;padding:9px 11px;cursor:pointer;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:44px}
.ex summary::-webkit-details-marker{display:none}.ex .en{flex:1 1 150px;font-weight:500}.ex .eq{font:400 11px var(--mono);color:var(--mut)}
.ex .det{padding:0 11px 10px;font-size:13px;color:#b9dbe4}.ex ul{margin:4px 0;padding-left:18px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.tags span{font:400 11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--mut)}
.empty{border:1px dashed var(--line);border-radius:6px;padding:12px;color:var(--mut);font-size:13px}
.back{background:none;border:0;color:var(--cy);font:500 12px var(--mono);padding:6px 0;min-height:36px}
/* worked mode */
.worked{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;margin-top:14px}
.pick{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;height:clamp(460px,80vh,860px);display:flex;flex-direction:column;min-height:0}
.pick .scroll{overflow:auto;flex:1;margin-top:8px;min-height:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}.chip{background:#04141d;border:1px solid var(--line);border-radius:99px;padding:6px 11px;font:500 11px var(--mono);min-height:34px}.chip[aria-pressed=true]{border-color:var(--cy);color:var(--cy)}
.thumb{width:44px;height:44px;border-radius:6px;object-fit:cover;background:#fff;flex:none}
.label{background:#f3f6f7;color:#14232b;border-radius:10px;overflow:hidden;max-width:760px;width:100%;box-shadow:0 0 40px rgba(77,232,255,.12)}
.label .hd{background:var(--hot);color:#fff;font:700 20px var(--disp);letter-spacing:.14em;padding:10px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}.label .hd small{font:400 11px var(--mono);letter-spacing:.06em}
.label .figs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:14px 12px 4px;background:radial-gradient(ellipse at 50% 40%,#0b3345,#04131c)}
.mini{position:relative;text-align:center;color:var(--mut);font:500 10px var(--mono);letter-spacing:.14em}.mini svg{width:100%;height:240px;display:block}
.mini .pend{height:240px;display:grid;place-items:center;border:1px dashed var(--line);border-radius:6px;font:400 10px var(--mono);padding:10px;line-height:1.5}
.label .names{padding:14px 16px 6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 18px;background:#f3f6f7}
.label .names div{display:flex;gap:8px;align-items:center;font:600 14px var(--disp);padding:4px 0;border-bottom:1px solid #d3dde1}
.label .names .badge{border-color:#9db;color:#345}.label .names .badge.pri{background:var(--hot);color:#fff;border-color:var(--hot)}.label .names .badge.sec{background:#ffe1d1;color:#9a3d12;border-color:#ffb08c}
.label .ft{padding:8px 16px 14px;font:400 11px var(--mono);color:#4f6670;background:#f3f6f7}
.wrapw{display:flex;justify-content:center;align-items:flex-start}
.foot{margin-top:22px;font:400 11px var(--mono);color:var(--mut);line-height:1.7}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:900px){
 main{grid-template-columns:1fr}.worked{grid-template-columns:1fr}
 .brand small{display:none}header{padding-bottom:8px}.ctl{gap:6px}.seg button{min-height:38px;padding:6px 10px;font-size:11px}
 .stage{height:calc(100vh - 235px);min-height:300px;margin-bottom:84px;transition:height .25s}
 body.sh-half .stage{height:calc(100vh - 235px - 38vh);min-height:260px}body.sh-full .stage{height:260px}
 .panel{position:fixed;left:0;right:0;bottom:0;z-index:40;height:var(--sheet,70px);border-radius:14px 14px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.6);transition:height .25s;padding-bottom:env(safe-area-inset-bottom,0px)}
 .panel.half{--sheet:42vh}.panel.full{--sheet:88vh}
 .handle{display:block;width:100%;background:none;border:0;padding:8px 0 2px;min-height:34px}.handle::before{content:"";display:block;width:44px;height:4px;border-radius:2px;background:var(--cy2);margin:0 auto}
 .pick{height:auto;max-height:60vh}.mini svg,.mini .pend{height:190px}
}
@media (max-width:520px){.label .names{grid-template-columns:1fr}.seg button{padding:8px 10px}.brand{font-size:17px}}
</style></head><body>

$('#stage').addEventListener('pointermove',e=>{const p=e.target.closest('path.u');if(p&&e.pointerType==='mouse'){tip.textContent=p.dataset.name;tip.style.display='block';tip.style.left=e.clientX+14+'px';tip.style.top=e.clientY+14+'px'}else tip.style.display='none'});
$('#stage').addEventListener('pointerleave',()=>tip.style.display='none');
function setView(v){st.view=v;drawFig();if(st.tab==='list')renderList();else renderSel()}
function setSex(s){st.sex=s;drawFig();if(st.mode==='exp'){st.tab==='list'?renderList():renderSel()}else renderLabel()}
$$('[data-sex]').forEach(b=>b.onclick=()=>setSex(b.dataset.sex));
$$('#views button[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
let sx=null;
$('#stage').addEventListener('pointerdown',e=>{sx=[e.clientX,e.clientY]});
$('#stage').addEventListener('pointerup',e=>{if(!sx)return;const dx=e.clientX-sx[0],dy=e.clientY-sx[1];sx=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)setView(st.view==='front'?'back':'front')});
/* ---------- muscles worked ---------- */
function setMode(m){st.mode=m;$('#explorer').hidden=m!=='exp';$('#worked').hidden=m!=='wrk';$('#mExp').setAttribute('aria-pressed',m==='exp');$('#mWrk').setAttribute('aria-pressed',m==='wrk');if(m==='wrk'){renderPick();renderLabel()}else drawFig()}
$('#mExp').onclick=()=>setMode('exp');$('#mWrk').onclick=()=>setMode('wrk');
const CATS=[['all','All'],['strength_machine','Machines'],['cable','Cable'],['free_weight','Free weight'],['cardio','Cardio'],['other','Other']];
function renderPick(){
  $('#pkM').setAttribute('aria-pressed',st.pk==='mach');$('#pkE').setAttribute('aria-pressed',st.pk==='ex');
  $('#pkQ').placeholder=st.pk==='mach'?'Search machines…':'Search exercises…';
  $('#pkChips').innerHTML=st.pk==='mach'?CATS.map(c=>`<button class="chip" data-cat="${c[0]}" aria-pressed="${st.pkCat===c[0]}">${c[1]}</button>`).join(''):'';
  const q=st.pkQ.toLowerCase();let h='';
  if(st.pk==='mach'){
    D.mach.filter(m=>(st.pkCat==='all'||m.cat===st.pkCat)&&(!q||m.n.toLowerCase().includes(q))).forEach((m,i)=>{h+=`<li><button class="row" data-pm="${D.mach.indexOf(m)}">${m.img?`<img class="thumb" alt="" src="${m.img}">`:'<span class="thumb"></span>'}<span class="nm">${m.n}</span><span class="meta">${m.ne} ex</span></button></li>`});
  }else{
    D.ex.map((e,i)=>[e,i]).filter(([e])=>!q||e.n.toLowerCase().includes(q)).slice(0,80).forEach(([e,i])=>{h+=`<li><button class="row" data-pe="${i}"><span class="nm">${e.n}</span><span class="meta">${e.m||'no equip.'}</span></button></li>`});
  }
  $('#pkList').innerHTML=h||'<div class="empty">Nothing found.</div>';
}
$('#pkM').onclick=()=>{st.pk='mach';st.pkSel=null;renderPick();renderLabel()};$('#pkE').onclick=()=>{st.pk='ex';st.pkSel=null;renderPick();renderLabel()};
$('#pkQ').oninput=e=>{st.pkQ=e.target.value;renderPick()};
$('#worked').addEventListener('click',e=>{
  const c=e.target.closest('[data-cat]');if(c){st.pkCat=c.dataset.cat;renderPick();return}
  const m=e.target.closest('[data-pm]');if(m){st.pkSel=+m.dataset.pm;renderLabel();return}
  const x=e.target.closest('[data-pe]');if(x){st.pkSel=+x.dataset.pe;renderLabel()}
});
function renderLabel(){
  const host=$('#labelHost');
  if(st.pkSel==null){st.pkSel=st.pk==='mach'?D.mach.findIndex(m=>m.n==='Lat Pulldown'):0;if(st.pkSel<0)st.pkSel=0}
  let title,p,s,foot;
  if(st.pk==='mach'){const m=D.mach[st.pkSel];title=m.n;p=m.p;s=m.q;
    const names=D.ex.filter(e=>e.m===m.n).map(e=>e.n);
    foot=`Derived from ${m.ne} exercise${m.ne>1?'s':''} on this machine (no machine muscle file supplied): primary = muscle is primary in ≥30% of them (max 5); secondary = other muscles that appear. Exercises: ${names.slice(0,8).join(', ')}${names.length>8?'…':''}`}
  else{const e=D.ex[st.pkSel];title=e.n;p=e.p.filter(x=>!SYS.has(x)||true);s=e.q;foot=`Exact muscles of this exercise from exercises.csv${e.m?' · equipment: '+e.m:''}`}
  const P=new Set(p.flatMap(expand)),S=new Set(s.flatMap(expand));
  const mini=(v,lab)=>`<div class="mini">${figSVG(st.sex,v,{static:true,pri:P,sec:S})}${lab}</div>`;
  const row=(id,r)=>`<div><span class="badge ${r}">${r==='pri'?'primary':'secondary'}</span>${M[id].name}</div>`;
  host.innerHTML=`<div class="label"><div class="hd"><span>MUSCLES WORKED</span><small>${title}</small></div>
  <div class="figs"><div class="mini"><div class="pend">SIDE VIEW<br>pending licensed source</div>SIDE</div>${mini('front','FRONT')}${mini('back','BACK')}</div>
  <div class="names">${p.map(id=>row(id,'pri')).join('')}${s.map(id=>row(id,'sec')).join('')}</div>
  <div class="ft">${foot}</div></div>`;
}
/* ---------- init ---------- */
$('#foot').innerHTML='Figures: MuscleMap by Jsplice (MIT, © 2026 Jsplice / MuscleMap contributors), traced vector art, modified: regions recoloured, chest and neck split by documented rules. Dashed outline = approximate region. Side view not included (no licensed source yet). Machine photos: Jerai supplier images – usage rights to be confirmed by the owner. Exercise data: your CSVs (592 exercises, 51 machines with exercises).';
drawFig();renderList();
window.__st=st;
</script></body></html>
