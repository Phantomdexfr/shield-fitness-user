<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shields" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d0c0a" />
    <meta name="color-scheme" content="dark" />
    <title>Shields</title>
    <style>
      /* Phase 108: launch polish. Same colour as --bg-base and the manifest (HTML cannot read CSS variables). The splash is the owner's logo, shown
         from the first paint until the app puts anything into #app; Classic (ux.surfaces off) shows only the plain dark page, as in 1.2.0. */
      html { background: #0d0c0a; }
      #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0d0c0a; pointer-events: none; }
      #splash img { width: 48vw; max-width: 220px; height: auto; /* the logo file has a slightly lighter backdrop: feather its edges into the page colour */ -webkit-mask-image: radial-gradient(circle farthest-corner at 50% 50%, #000 57%, transparent 80%); mask-image: radial-gradient(circle farthest-corner at 50% 50%, #000 57%, transparent 80%); }
      #app:not(:empty) ~ #splash { display: none; }
      :root[data-ux-surfaces='classic'] #splash { display: none; }
    </style>
    <script>
      /* Interface style, applied before first paint. Key order must equal UX_KEYS in src/shared/ux.ts (guard-tested). Missing = premium. */
      try {
        var k = ['surfaces', 'icons', 'tabbar', 'headers', 'controls', 'wheels', 'sheets', 'motion', 'layout', 'tidy'];
        var m = localStorage.getItem('sf.ux') || '';
        for (var i = 0; i < k.length; i++) document.documentElement.setAttribute('data-ux-' + k[i], m.charAt(i) === '0' ? 'classic' : 'premium');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="splash" aria-hidden="true"><img src="%BASE_URL%icons/logo.png" alt="" width="180" height="241" /></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
